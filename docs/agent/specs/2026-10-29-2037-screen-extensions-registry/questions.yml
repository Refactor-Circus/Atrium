- id: Q-002
  question: "Do Atrium's own screens (history/show etc.) adopt Screen::make in this spec?"
  options:
    - "No, only the workbench test-host"
    - "Yes, declare Atrium's own screens now"
  recommendation: "No, only the workbench test-host"
  evidence: "criteria only exercise the test-host; no consumer for Atrium screens yet"
  source: spec-review
- id: Q-003
  question: "Is the audited section's slot implicitly declared by audits() or must it be listed in slots()?"
  options:
    - "Must also appear in slots()"
    - "Implicitly declared by audits()"
  recommendation: "Must also appear in slots()"
  evidence: "criterion 10; slots() is the single place hosts list extension points"
  source: spec-review
- id: Q-004
  question: "How should a throwing resolver or failing registered view affect the host screen?"
  options:
    - "Isolate for sections and row slots, propagate for the open tab"
    - "Always propagate (500)"
    - "Always isolate (report, skip, 200)"
  recommendation: "Isolate for sections and row slots, propagate for the open tab"
  evidence: "criterion 7 covers throwing authorize only; sections sit on screens opened for other reasons"
  source: spec-review
