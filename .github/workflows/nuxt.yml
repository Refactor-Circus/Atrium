name: nuxt

# The Nuxt layer gate (composer test:nuxt): the contract fixtures exist, a
# frozen pnpm install, typecheck, the playground build, Vitest, and a build
# of a fresh consumer app against a copy of nuxt/layer. It runs apart from
# the PHP suite (tests.yml), which stays Node-free.

on:
  push:
    branches:
      - main
      - '*.x'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nuxt:
    runs-on: ubuntu-latest

    name: Nuxt layer

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: nuxt/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: nuxt/pnpm-lock.yaml

      - name: Nuxt layer gate
        run: composer test:nuxt
